[project]
name = "opsly-assgn"
version = "0.1.0"
description = "Opsly assignment — MCP agents + Neo4j over the FastAPI repo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "httpx>=0.28.1",
    "groq>=0.13.0",
    "neo4j>=5.26.0",
    "mcp>=1.1.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
opsly-gateway = "opsly.gateway.main:run"
opsly-orchestrator = "opsly.agents.orchestrator_server:main"
opsly-indexer = "opsly.agents.indexer_server:main"
opsly-graph-query = "opsly.agents.graph_query_server:main"
opsly-code-analyst = "opsly.agents.code_analyst_server:main"
opsly-memory = "opsly.agents.memory_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opsly"]

[tool.hatch.build.targets.wheel.force-include]
"src/opsly/graph/schema.cypher" = "opsly/graph/schema.cypher"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/opsly"]
omit = [
    "src/opsly/agents/*",
    "src/opsly/gateway/main.py",
    "src/opsly/gateway/chat_flow.py",
    "src/opsly/mcp_client.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
